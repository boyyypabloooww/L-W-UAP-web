<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail - L&W</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- NAVBAR -->
    <div class="nav">
        <a href="index.html" class="logo">
            <img src="https://placehold.co/100x40/ffffff/7a1d13?text=L%26W+Logo" alt="L&W Logo" class="logo-img">
        </a>
        <div class="menu">
            <a href="index.html">HOME</a>
            <a href="catalog.html">CATALOG</a>
        </div>
        <div class="auth">
            <a href="login.html" class="btn btn-outline">LOGIN</a>
            <a href="register.html" class="btn btn-solid">REGISTER</a>
        </div>
    </div>

    <!-- PRODUCT DETAIL -->
    <div class="detail-area">
        <div class="detail-img-box">
            <!-- Main Product Image -->
            <img src="https://placehold.co/500x500/eeeeee/7a1d13?text=Main+Perfume+Image" alt="Stronger With You" class="img img-detail">
        </div>
        <div class="detail-info">
            <p class="brand-name">GIORGIO ARMANI</p>
            <h2 class="title" style="margin-bottom: 10px; font-size: 36px;">Stronger With You Powerfully EDP 100 ml</h2>
            <p class="price" style="font-size: 28px; margin-bottom: 20px;">Rp 1.970.000</p>
            
            <p style="margin-bottom: 20px; color: #555; line-height: 1.6; font-size: 16px;">
                Elegant perfume with a strong and masculine scent, perfect for the modern man.
            </p>
            
            <p class="stock-info">Stock Available: <strong>50</strong></p>
            
            <!-- Add to Cart Action -->
            <form action="login.html" style="display: flex; align-items: center; margin-top: 20px;">
                <div style="margin-right: 15px;">
                    <label style="display: block; font-size: 12px; margin-bottom: 5px;">Quantity</label>
                    <input type="number" class="qty-input" value="1" min="1" max="50" required>
                </div>
                <button type="submit" class="btn btn-solid" style="padding: 12px 30px;">ADD TO CART</button>
            </form>
        </div>
    </div>

    <div class="footer">
        © 2026 L&W Luxury & Woods. All Rights Reserved.
    </div>

    <script src="script.js"></script>
</body>
</html>
