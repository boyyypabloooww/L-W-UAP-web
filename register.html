<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - L&W</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- NAVBAR -->
    <div class="nav">
        <a href="index.html" class="logo">
            <img src="https://placehold.co/100x40/ffffff/7a1d13?text=L%26W+Logo" alt="L&W Logo" class="logo-img">
        </a>
        <div class="menu">
            <a href="index.html">HOME</a>
            <a href="catalog.html">CATALOG</a>
        </div>
        <div class="auth">
            <a href="login.html" class="btn btn-outline">LOGIN</a>
            <a href="register.html" class="btn btn-solid">REGISTER</a>
        </div>
    </div>

    <!-- REGISTER FORM -->
    <div class="form-box">
        <div class="form-header">
            <img src="https://placehold.co/60x60/7a1d13/ffffff?text=Reg" alt="Register Icon" class="form-icon">
            <h2 class="title" style="text-align: center; font-size: 32px; margin-bottom: 10px;">Register</h2>
        </div>
        
        <form action="login.html">
            <div class="input-group">
                <label>Username</label>
                <input type="text" placeholder="5 - 20 characters" required minlength="5" maxlength="20">
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Must end with @gmail.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Minimum 8 characters" required minlength="8">
            </div>
            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" required minlength="8">
            </div>
            <button type="submit" class="btn btn-solid btn-full">REGISTER</button>
            
            <p style="text-align: center; margin-top: 15px; font-size: 14px;">
                Already have an account? <a href="login.html" style="color: #7a1d13; font-weight: bold;">Login here.</a>
            </p>
        </form>
    </div>

    <div class="footer">
        © 2026 L&W Luxury & Woods. All Rights Reserved.
    </div>

    <script src="script.js"></script>
</body>
</html>
