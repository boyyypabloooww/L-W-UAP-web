<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - L&W</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- NAVBAR -->
    <div class="nav">
        <a href="index.html" class="logo">
            <img src="https://placehold.co/100x40/ffffff/7a1d13?text=L%26W+Logo" alt="L&W Logo" class="logo-img">
        </a>
        <div class="menu">
            <a href="index.html">HOME</a>
            <a href="catalog.html">CATALOG</a>
        </div>
        <div class="auth">
            <a href="login.html" class="btn btn-outline">LOGIN</a>
            <a href="register.html" class="btn btn-solid">REGISTER</a>
        </div>
    </div>

    <!-- LOGIN FORM -->
    <div class="form-box">
        <div class="form-header">
            <img src="https://placehold.co/60x60/7a1d13/ffffff?text=Log" alt="Login Icon" class="form-icon">
            <h2 class="title" style="text-align: center; font-size: 32px; margin-bottom: 10px;">Login</h2>
        </div>

        <form action="index.html">
            <div class="input-group">
                <label>Email</label>
                <input type="email" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" required>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="remember">
                <label for="remember">Remember Me</label>
            </div>
            <button type="submit" class="btn btn-solid btn-full">LOGIN</button>
            
            <p style="text-align: center; margin-top: 15px; font-size: 14px;">
                <a href="register.html" style="color: #7a1d13; font-weight: bold;">Register a new account.</a>
            </p>
        </form>
    </div>

    <div class="footer">
        © 2026 L&W Luxury & Woods. All Rights Reserved.
    </div>

    <script src="script.js"></script>
</body>
</html>
